[project]
name = "house-lint"
version = "0.1.2"
description = "Opinionated Python house-style linter"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NodeJSmith" }]
keywords = ["lint", "python", "house-style", "pre-commit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["cyclopts>=3.0", "pathspec>=0.12"]

[project.scripts]
house-lint = "house_lint.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
  "pyright>=1.1",
  "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No marker filtering: `pytest` runs the same set everywhere. The one suite too slow for a local
# run gates itself on the `CI` environment variable instead — see test_gitignore_fuzz.py.

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["design"]

[tool.ruff.format]
exclude = ["design"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
