[project]
name = "house-lint"
version = "0.5.0"
description = "Lint checks that catch the habits AI coding assistants leave behind"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NodeJSmith" }]
keywords = ["lint", "python", "ai", "pre-commit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "cyclopts>=3.0",
    "msgspec>=0.22,<0.23",
    "pathspec>=1.0,<2",
]

[project.optional-dependencies]
duplicates = ["jscpd==5.4.1"]

[project.scripts]
house-lint = "house_lint.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
  "pyright>=1.1",
  "pyyaml>=6.0",
  # Matches the `duplicates` extra's pin: HSL104's tests run the real tool.
  "jscpd==5.4.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["design"]

[tool.ruff.format]
exclude = ["design"]

[tool.house-lint]
# design/ holds research probe corpora: deliberately duplicated code and test pragmas.
exclude = ["design"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
