name: Release Please

# release-please opens/updates the release PR and, when that PR merges, creates
# the GitHub release + tag and bumps the version in pyproject.toml. It authenticates
# with a GitHub App token (secrets RELEASE_PLEASE_APP_ID / RELEASE_PLEASE_APP_PRIVATE_KEY)
# rather than the default GITHUB_TOKEN, because GitHub suppresses workflow runs for
# events made with GITHUB_TOKEN — release PRs opened with it never trigger CI's
# pull_request-triggered checks. When a release is created, the build job builds
# the tagged version and the publish-pypi job uploads it to PyPI via Trusted
# Publishing (OIDC) — no API token stored in the repo. PyPI must have a publisher
# configured for this repo + workflow + the `pypi` environment. The
# sync-release-notes job then replaces the generated release body with the
# version's curated CHANGELOG.md section. Publisher config:
# PyPI project `house-lint`, owner `NodeJSmith`, repo `house-lint`, workflow
# `release-please.yml`, environment `pypi`.
#
# release-please bumps the version in pyproject.toml but does NOT know about
# uv.lock — whose self-referenced house-lint version would otherwise stay stale
# until a contributor's next `uv sync`, surfacing as a spurious lockfile diff.
# The sync-lockfile job below closes that gap by re-locking on the release PR
# branch so the bump lands in the same PR.

on:
    push:
        branches: [master]
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Existing release tag to build and publish (for example, v0.1.0)"
                required: true
                type: string

concurrency:
    group: release-please
    cancel-in-progress: false

jobs:
    release-please:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            pr: ${{ steps.release.outputs.pr }}
        steps:
            # A GitHub App token (not the default GITHUB_TOKEN) so the release PR
            # and the sync-lockfile commit trigger required checks. GitHub
            # suppresses workflow runs for events made with GITHUB_TOKEN, which
            # would otherwise leave release PRs with no CI checks at all.
            - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              id: app-token
              with:
                  app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write

            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
              id: release
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    # Runs only when release-please has an open PR (not on the push that creates
    # the release itself).
    sync-lockfile:
        needs: release-please
        if: needs.release-please.outputs.pr && needs.release-please.outputs.release_created != 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            # Re-mint the App token here — tokens are short-lived and don't pass
            # across jobs — so the lockfile commit is pushed as the App and
            # therefore triggers the release PR's required checks.
            - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              id: app-token
              with:
                  app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
                  permission-contents: write

            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
                  token: ${{ steps.app-token.outputs.token }}
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
              with:
                  enable-cache: false

            - name: Re-lock to include the release version
              run: uv lock

            - name: Commit and push lockfile updates
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PR_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  if git diff --quiet -- uv.lock; then
                      echo "uv.lock already matches the release version"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add uv.lock
                  git commit -m "chore: sync uv.lock to release version"
                  git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${PR_BRANCH}"

    build:
        needs: release-please
        if: >-
            always()
            && (
              github.event_name == 'release'
              || github.event_name == 'workflow_dispatch'
              || needs.release-please.outputs.release_created == 'true'
            )
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        outputs:
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: Select release tag
              id: release
              env:
                  CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  DISPATCH_TAG: ${{ inputs.tag_name }}
              run: |
                  set -euo pipefail
                  tag_name="${CREATED_TAG:-${RELEASE_TAG:-${DISPATCH_TAG:-}}}"
                  if [[ -z "$tag_name" ]]; then
                      echo "::error::No release tag was provided"
                      exit 1
                  fi
                  echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  ref: ${{ steps.release.outputs.tag_name }}
                  persist-credentials: false

            - name: Install uv and Python
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
              with:
                  python-version: "3.11"
                  enable-cache: false

            - name: Verify tag matches project version
              env:
                  TAG_NAME: ${{ steps.release.outputs.tag_name }}
              run: |
                  set -euo pipefail
                  project_version="$(uv version --short)"
                  if [[ "$TAG_NAME" != "v${project_version}" ]]; then
                      echo "::error::Tag ${TAG_NAME} does not match project version ${project_version}"
                      exit 1
                  fi

            - name: Install dependencies
              run: uv sync --locked

            - name: Run tests
              run: uv run pytest

            - name: Run Ruff
              run: uv run ruff check .

            - name: Run Pyright
              run: uv run pyright

            - name: Build sdist and wheel
              run: uv build

            - name: Upload distributions
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: pypi-dists
                  path: dist/

    # GitHub creates the release body from release-please's generated notes, not
    # from CHANGELOG.md, so a changelog curated on the release PR never reaches
    # the release page on its own. This copies the version's CHANGELOG.md section
    # over the body. It depends only on release-please, so a failed build or
    # publish still leaves the curated notes in place. always() is needed because
    # release-please is skipped on workflow_dispatch. The `release` event is
    # left out because the push run that created the release already covers it.
    sync-release-notes:
        needs: release-please
        if: >-
            always()
            && (
              (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
              || github.event_name == 'workflow_dispatch'
            )
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  ref: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
                  persist-credentials: false

            # github.token is enough: editing the body needs contents: write, and
            # nothing has to react to the edit.
            - name: Copy the CHANGELOG.md section into the release notes
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
              run: |
                  set -euo pipefail
                  version="${TAG_NAME#v}"
                  notes_file="$(mktemp)"
                  # The section runs from "## [<version>]" to the next "## [" heading.
                  # It contains "###" and "####" headings, so only "## [" ends it.
                  awk -v heading="## [${version}]" '
                      /^## \[/ {
                          if (found) exit
                          if (index($0, heading) == 1) found = 1
                          next
                      }
                      found { print }
                  ' CHANGELOG.md > "$notes_file"
                  if ! grep -q '[^[:space:]]' "$notes_file"; then
                      echo "::warning::CHANGELOG.md has no section for ${version}; leaving the release notes unchanged"
                      exit 0
                  fi
                  gh release edit "$TAG_NAME" --notes-file "$notes_file"

    publish-pypi:
        needs: build
        # always() because build's own needs (release-please) is skipped on the
        # release and workflow_dispatch events, and without it that skip would
        # skip this job too.
        if: always() && needs.build.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: pypi
            url: https://pypi.org/p/house-lint
        permissions:
            id-token: write
        steps:
            - name: Download distributions
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: pypi-dists
                  path: dist/

            - name: Publish to PyPI with Trusted Publishing
              uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
              with:
                  skip-existing: true

    smoke-test:
        needs: [build, publish-pypi]
        if: always() && needs.publish-pypi.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Install uv
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
              with:
                  enable-cache: false

            - name: Verify the published CLI
              env:
                  TAG_NAME: ${{ needs.build.outputs.tag_name }}
              run: |
                  set -euo pipefail
                  version="${TAG_NAME#v}"
                  for attempt in 1 2 3 4 5; do
                      if uvx --from "house-lint==${version}" house-lint rules --format json; then
                          exit 0
                      fi
                      if [[ "$attempt" -lt 5 ]]; then
                          echo "Package not available yet; retrying in 15 seconds"
                          sleep 15
                      fi
                  done
                  exit 1
