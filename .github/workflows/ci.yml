name: CI

on:
    pull_request:
        branches: [master]
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    test:
        name: Tests (Python ${{ matrix.python-version }})
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.11", "3.12", "3.13", "3.14"]
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  persist-credentials: false

            - name: Install uv and Python
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --locked

            - name: Run tests
              run: uv run pytest

    quality:
        name: Quality
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  persist-credentials: false

            - name: Install uv and Python
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
              with:
                  python-version: "3.11"
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --locked

            - name: Run Ruff
              run: uv run ruff check .

            - name: Run Pyright
              run: uv run pyright

            - name: Build package
              run: uv build
