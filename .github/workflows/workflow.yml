name: Release and Publish

on:
    push:
        branches: [master]
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag_name:
                description: "Existing release tag to build and publish (for example, v0.1.0)"
                required: true
                type: string

concurrency:
    group: release-and-publish
    cancel-in-progress: false

jobs:
    release-please:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            pull-requests: write
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
            pr: ${{ steps.release.outputs.pr }}
        steps:
            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
              id: release
              with:
                  token: ${{ github.token }}
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json

    sync-lockfile:
        needs: release-please
        if: needs.release-please.outputs.pr && needs.release-please.outputs.release_created != 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
              with:
                  enable-cache: false

            - name: Re-lock to include the release version
              run: uv lock

            - name: Commit and push lockfile updates
              env:
                  GH_TOKEN: ${{ github.token }}
                  PR_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  set -euo pipefail
                  if git diff --quiet -- uv.lock; then
                      echo "uv.lock already matches the release version"
                      exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add uv.lock
                  git commit -m "chore: sync uv.lock to release version"
                  git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${PR_BRANCH}"

    build:
        needs: release-please
        if: >-
            always()
            && (
              github.event_name == 'release'
              || github.event_name == 'workflow_dispatch'
              || needs.release-please.outputs.release_created == 'true'
            )
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
        outputs:
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - name: Select release tag
              id: release
              env:
                  CREATED_TAG: ${{ needs.release-please.outputs.tag_name }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  DISPATCH_TAG: ${{ inputs.tag_name }}
              run: |
                  set -euo pipefail
                  tag_name="${CREATED_TAG:-${RELEASE_TAG:-${DISPATCH_TAG:-}}}"
                  if [[ -z "$tag_name" ]]; then
                      echo "::error::No release tag was provided"
                      exit 1
                  fi
                  echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
              with:
                  ref: ${{ steps.release.outputs.tag_name }}
                  persist-credentials: false

            - name: Install uv and Python
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
              with:
                  python-version: "3.11"
                  enable-cache: false

            - name: Verify tag matches project version
              env:
                  TAG_NAME: ${{ steps.release.outputs.tag_name }}
              run: |
                  set -euo pipefail
                  project_version="$(uv version --short)"
                  if [[ "$TAG_NAME" != "v${project_version}" ]]; then
                      echo "::error::Tag ${TAG_NAME} does not match project version ${project_version}"
                      exit 1
                  fi

            - name: Install dependencies
              run: uv sync --locked

            - name: Run tests
              run: uv run pytest

            - name: Run Ruff
              run: uv run ruff check .

            - name: Run Pyright
              run: uv run pyright

            - name: Build sdist and wheel
              run: uv build

            - name: Upload distributions
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
              with:
                  name: pypi-dists
                  path: dist/

    publish-pypi:
        needs: build
        if: needs.build.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment:
            name: pypi
            url: https://pypi.org/p/house-lint
        permissions:
            id-token: write
        steps:
            - name: Download distributions
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
              with:
                  name: pypi-dists
                  path: dist/

            - name: Publish to PyPI with Trusted Publishing
              uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
              with:
                  skip-existing: true

    smoke-test:
        needs: [build, publish-pypi]
        if: always() && needs.publish-pypi.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Install uv
              uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8
              with:
                  enable-cache: false

            - name: Verify the published CLI
              env:
                  TAG_NAME: ${{ needs.build.outputs.tag_name }}
              run: |
                  set -euo pipefail
                  version="${TAG_NAME#v}"
                  for attempt in 1 2 3 4 5; do
                      if uvx --from "house-lint==${version}" house-lint rules --format json; then
                          exit 0
                      fi
                      if [[ "$attempt" -lt 5 ]]; then
                          echo "Package not available yet; retrying in 15 seconds"
                          sleep 15
                      fi
                  done
                  exit 1
