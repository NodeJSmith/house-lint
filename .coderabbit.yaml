# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: assertive
  auto_review:
    enabled: false
    drafts: false
    base_branches:
      - master

  request_changes_workflow: false
  high_level_summary: true
  # The PR body becomes the squash commit body, and a BREAKING CHANGE footer runs to its end,
  # so a summary appended to the description would land in the changelog's breaking-change note.
  high_level_summary_in_walkthrough: true
  poem: false

  path_instructions:
    - path: "src/house_lint/rules/**"
      instructions: |
        Detector modules. Each detector has signature
        `(source, options, *, limit=None) -> list[CandidateFinding]`, and a
        rule with options declares its options type (a frozen `RuleOptions`
        subclass) in its own module. A new or renamed rule needs one row in
        `rule_catalog.py`. HSL900 (suppression-pragma validation) must never
        become disableable or suppressible — flag any change that would let it
        be skipped via config or pragma.

    - path: "src/house_lint/rule_catalog.py"
      instructions: |
        The table of rules: the single source of truth for each rule's ID,
        display info, enablement tier (default vs opt-in vs always-on),
        detector, and options. Check that tier placement (HSL0xx default,
        HSL1xx opt-in, HSL900 always-on) is correct, and that rows go through
        `file_rule` or `configurable_rule` so a detector and options type that
        disagree fail the type check.

    - path: "src/house_lint/reporters/**"
      instructions: |
        Output formatting (text/json reporters consumed by the CLI). Check
        that output stays stable/parseable for the json reporter and that
        stdout is reserved for data while diagnostics go to stderr, per the
        CLI's documented contract.

    - path: "src/house_lint/cli.py"
      instructions: |
        cyclopts-based CLI entry point and the process's exception boundary.
        Verify that fallible operations (path resolution, config loading,
        file discovery) run inside the try/except that converts unexpected
        exceptions into the documented internal-error result and exit code,
        rather than escaping uncaught. Check exit codes match the documented
        contract (1 findings, 2 config error, 3 incomplete scan/budget, 4 internal error).

    - path: "tests/unit/rules/**"
      instructions: |
        Mirrors src/house_lint/rules/ 1:1. Use the write_sample(content) fixture
        from tests/conftest.py (dedents and writes to tmp_path/sample.py)
        instead of ad hoc file writes. Check new rule tests cover both a
        triggering case and a non-triggering (clean) case.

    - path: "tests/integration/**"
      instructions: |
        End-to-end CLI behavior tests (subprocess or in-process cli.check()
        calls). Check that error-path tests assert on both the exit code and
        the structured JSON error kind, matching the sibling tests already in
        the file, rather than only checking exit code.

chat:
  auto_reply: true
